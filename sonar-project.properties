sonar.projectKey=opencascade-c-bridge
sonar.projectName=opencascade-c-bridge
sonar.sourceEncoding=UTF-8
sonar.sources=src,include,rust/occt-bridge/src,rust/occt-recipes/src,rust/occt-parametric/src
sonar.tests=tests,tools/sonar
sonar.test.inclusions=tests/**,tools/sonar/test_*.py
sonar.exclusions=build/**,rust/**/target/**
sonar.coverage.exclusions=tests/**,tools/sonar/**
sonar.coverageReportPaths=build/coverage/sonar-generic-coverage.xml
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.rust.cargo.manifestPaths=rust/occt-bridge/Cargo.toml,rust/occt-recipes/Cargo.toml,rust/occt-parametric/Cargo.toml
sonar.rust.clippy.enabled=false
sonar.python.version=3.14
