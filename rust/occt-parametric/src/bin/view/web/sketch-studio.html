<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch studio</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #1d2733; --muted: #5d6b7c; --line: #d9dee6;
    --accent: #2f6fdb; --accent-ink: #ffffff; --view: #e9edf2; --grid: #b9c3d0; --axis: #7d8ca0;
    --free: #2f6fdb; --fixed: #1d2733; --conflict: #cf222e; --pass: #1a7f37; --ghost: #c36d12;
    --plane: #7a5bc7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191f; --panel: #1c2128; --ink: #e3e8ef; --muted: #98a4b3; --line: #2d343e;
      --accent: #6ea0ff; --accent-ink: #0b1220; --view: #20252d; --grid: #3a4350; --axis: #6b7889;
      --free: #6ea0ff; --fixed: #e3e8ef; --conflict: #ff7b72; --pass: #56d364; --ghost: #f0a35e;
      --plane: #b39dff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191f; --panel: #1c2128; --ink: #e3e8ef; --muted: #98a4b3; --line: #2d343e;
    --accent: #6ea0ff; --accent-ink: #0b1220; --view: #20252d; --grid: #3a4350; --axis: #6b7889;
    --free: #6ea0ff; --fixed: #e3e8ef; --conflict: #ff7b72; --pass: #56d364; --ghost: #f0a35e;
      --plane: #b39dff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 236px 1fr 270px;
    grid-template-areas: "bar bar bar" "layers view inspector" "status status status";
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  input, select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; width: 100%;
  }
  #bar {
    grid-area: bar; display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  #bar h1 { font-size: 14px; margin: 0 10px 0 0; white-space: nowrap; }
  #bar .group { display: flex; gap: 4px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  #bar .group:last-child { border-right: 0; }
  #bar .spacer { flex: 1; }
  #bar kbd { font-size: 10px; color: var(--muted); margin-left: 3px; }
  #side, #inspector { background: var(--panel); overflow: auto; padding: 10px; }
  #side { grid-area: layers; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  #side > section + section { border-top: 1px solid var(--line); padding-top: 8px; }
  .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
  .palette button {
    position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 2px 4px;
    font-size: 11px; line-height: 1.2; border-color: transparent; background: transparent;
  }
  .palette button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .palette button[aria-pressed="true"], .palette button[aria-pressed="true"]:hover:not(:disabled) {
    background: var(--accent); color: var(--accent-ink); }
  .palette svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  .palette kbd { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); }
  .palette button[aria-pressed="true"] kbd { color: inherit; opacity: 0.75; }
  #tool-options { display: grid; gap: 6px; }
  #tool-options:empty { display: none; }
  #tool-options label { flex-wrap: wrap; }
  #tool-options input:not([type="checkbox"]), #tool-options select { width: 100%; min-width: 0; }
  #tool-options p { margin: 2px 0; color: var(--muted); font-size: 12px; }
  #tool-options label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .form .palette { grid-template-columns: repeat(5, 1fr); margin: 0; }
  .form .palette button { font-size: 10px; padding: 5px 1px 3px; }
  .plane-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .point-row { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)) auto; gap: 3px; align-items: center; }
  .point-row input { padding: 3px 4px; font-size: 12px; }
  .point-row button { padding: 3px 6px; }
  .point-row:not(:has(button)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .form-error { margin: 0; color: var(--conflict); }
  #inspector { grid-area: inspector; border-left: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 4px 0 8px; }
  .layer {
    display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 6px;
    padding: 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .layer:hover { border-color: var(--line); }
  .layer[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .layer input { width: auto; margin: 0; }
  .layer .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .layer .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .meta { grid-column: 3; color: var(--muted); font-size: 12px; }
  .layer .meta.error { color: var(--conflict); }
  .form { display: grid; gap: 8px; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  .form label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  .form .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #view { grid-area: view; position: relative; background: var(--view); min-width: 0; min-height: 0; overflow: hidden; }
  #view canvas, #view svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #view canvas { cursor: grab; touch-action: none; }
  #view svg { pointer-events: none; }
  #view svg .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  #view svg .axis { stroke: var(--axis); stroke-width: 1.4; fill: none; }
  #view svg .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  #view svg .curve.source { stroke-dasharray: 5 4; opacity: 0.75; }
  #view svg .curve.edited { pointer-events: none; }
  #view svg .inactive { opacity: 0.35; }
  #view svg .point { stroke: var(--panel); stroke-width: 1.5; }
  #view svg .ghost { fill: none; stroke: var(--ghost); stroke-width: 2; stroke-dasharray: 6 4; }
  #view svg .datum-plane path { fill: color-mix(in srgb, var(--plane) 5%, transparent); stroke: var(--plane);
    stroke-width: 1.2; stroke-dasharray: 8 4; }
  #view svg .datum-plane.selected path { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent);
    stroke-width: 2; stroke-dasharray: none; }
  #view svg .datum-plane.preview path { fill: color-mix(in srgb, var(--ghost) 8%, transparent); stroke: var(--ghost);
    stroke-width: 2; }
  #view svg .datum-plane text { font-size: 12px; font-weight: 600; fill: var(--plane); }
  #view svg .datum-plane.selected text { fill: var(--accent); }
  #view svg .datum-plane.preview text { fill: var(--ghost); }
  #view svg .plane-points circle { fill: var(--ghost); stroke: var(--panel); stroke-width: 1.5; }
  #view svg .halo { fill: none; stroke: var(--view); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  #view svg .label rect { fill: var(--panel); stroke: var(--line); }
  #view svg .label text, #view svg .badge text { font-size: 12px; fill: var(--ink); }
  #view svg .label.glyph text { font-weight: 600; fill: var(--muted); }
  #view svg .label.editable { pointer-events: all; cursor: text; }
  #view svg .label.editable:focus rect { stroke: var(--accent); stroke-width: 2; }
  #view svg .label.reference rect { stroke-dasharray: 3 2; }
  #view svg .label.failed rect { stroke: var(--conflict); }
  #view svg .label.failed text { fill: var(--conflict); }
  #view svg .label.related rect { stroke: var(--accent); stroke-width: 2; }
  #view svg .leader { stroke: var(--muted); stroke-width: 1; fill: none; }
  #view svg .badge { pointer-events: all; cursor: help; }
  #view svg .badge > rect { fill: var(--accent); }
  #view svg .badge > text { fill: var(--accent-ink); font-weight: 600; }
  #view svg .badge-list { display: none; }
  #view svg .badge:hover .badge-list { display: inline; }
  #view svg .badge-list rect { fill: var(--panel); stroke: var(--line); }
  #view svg .badge-list text { font-size: 12px; fill: var(--ink); }
  #view .empty {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted);
    text-align: center; max-width: 320px; pointer-events: none;
  }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  #status {
    grid-area: status; display: flex; gap: 16px; padding: 5px 10px; background: var(--panel);
    border-top: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  #status .message { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  #status .error { color: var(--conflict); }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 55vh auto auto;
      grid-template-areas: "bar" "layers" "view" "inspector" "status"; }
    #side, #inspector { max-height: 30vh; border: 0; }
    .palette { grid-template-columns: repeat(6, 1fr); }
  }
</style>
</head>
<body>
<header id="bar">
  <h1>Sketch studio</h1>
  <div class="group">
    <button id="look-at" title="Look square at the active plane (N)">Look at<kbd>N</kbd></button>
    <button id="fit" title="Fit the model in view (F)">Fit<kbd>F</kbd></button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="draft-actions"></div>
  <a href="/" style="color: var(--muted)">Classic viewer</a>
</header>
<aside id="side">
  <section aria-label="Sketch tools">
    <div id="tools" role="toolbar" aria-orientation="vertical" aria-label="Sketch tools"></div>
    <div id="tool-options"></div>
  </section>
  <section id="named-points" aria-label="Named point links"></section>
  <section id="sketch-patterns" aria-label="Linked sketch patterns"></section>
  <section id="curve-edits" aria-label="Curve and region edits"></section>
  <section id="solid-features" aria-label="Solid features"></section>
  <section id="material-boundaries" aria-label="Material boundaries"></section>
  <section id="source-links" aria-label="Source links"></section>
  <section id="planes" aria-label="Datum planes"></section>
  <section id="layers" aria-label="Sketch layers"></section>
</aside>
<main id="view">
  <canvas id="canvas" aria-label="3D model view"></canvas>
  <svg id="overlay" role="group" aria-label="Sketch geometry and dimensions"></svg>
  <p class="empty" id="empty" hidden></p>
</main>
<aside id="inspector" aria-label="Inspector"></aside>
<footer id="status" aria-live="polite"></footer>
<script type="module">
import { startStudio } from './sketch-studio-app.mjs';
startStudio(document);
</script>
</body>
</html>
