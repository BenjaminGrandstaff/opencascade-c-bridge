<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model viewer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #d9dde4; --accent: #2f6fdb; --error: #b42318; --canvas: #e9ecf1; --pass: #1a7f37;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2;
      --line: #2c323c; --accent: #6ea0ff; --error: #ff8a80; --canvas: #20252d; --pass: #56d364;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr;
    font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 16px; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .parameter { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
  .parameter label { display: flex; justify-content: space-between; gap: 8px; }
  .parameter input[type=number], select {
    width: 100%; padding: 4px 6px; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 6px 10px; font: inherit; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  #error { color: var(--error); white-space: pre-wrap; font-size: 12px; }
  main { position: relative; background: var(--canvas); min-width: 0; }
  .view-switch { position: absolute; top: 12px; left: 12px; z-index: 2; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); display: flex; align-items: center; gap: 8px; }
  #view-mode { width: auto; }
  #annotated { position: absolute; inset: 58px 0 0; overflow: auto; }
  #annotation-message { position: absolute; top: 62px; left: 18px; z-index: 3; background: var(--panel); padding: 6px; }
  [hidden] { display: none !important; }
  .parameter.linked { border-left: 3px solid var(--accent); padding-left: 8px; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #hint { position: absolute; left: 12px; bottom: 10px; }
  .scope { display: grid; gap: 4px; }
  .tag {
    font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap;
  }
  .tag.own { border-color: var(--accent); color: var(--accent); }
  .reset { flex: none; padding: 0 6px; font-size: 11px; }
  .label-end { display: flex; gap: 6px; align-items: center; }
  #requirements { display: grid; gap: 6px; }
  .summary { font-weight: 600; }
  .summary .failed, .check.failed .mark { color: var(--error); }
  .summary .passed, .check.passed .mark { color: var(--pass); }
  .check { display: grid; grid-template-columns: 16px 1fr; gap: 0 6px; font-size: 12px; }
  .check .detail { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
  .placement { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
  .triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .triple input, .placement input[type=number] {
    width: 100%; min-width: 0; padding: 4px 6px; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    main { grid-row: 1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1 id="family">Loading…</h1>
    <div class="muted" id="model"></div>
  </div>
  <div class="actions">
    <button class="primary" id="save" disabled>Save</button>
    <button id="revert" disabled title="Discard unsaved changes and reload the file">Revert</button>
    <button id="fit">Fit view</button>
  </div>
  <div class="muted" id="status"></div>
  <div id="requirements"></div>
  <div class="scope">
    <label class="muted" for="scope">Editing</label>
    <select id="scope"><option value="">Family defaults (all instances)</option></select>
    <div class="muted">Click a part to edit only that instance; click empty space to go back.</div>
  </div>
  <div id="error"></div>
  <div id="parameters"></div>
</aside>
<main>
  <div class="view-switch"><label for="view-mode">View</label><select id="view-mode"><option value="annotated">Dimensions &amp; sketches</option><option value="assembly">Assembly</option></select></div>
  <div id="annotation-message" class="muted" hidden></div>
  <div id="annotated"></div>
  <canvas id="view"></canvas>
  <div class="muted" id="hint">Click to select · Drag to orbit · Shift-drag or right-drag to pan · Wheel to zoom</div>
</main>
<script src="/annotations.js"></script>
<script type="module">
import { createAnnotationController, editableControls } from "./annotations.mjs";
import { createRenderer, fitCamera, modelToGltf, pan, parseGltf, pick, ray } from "./viewer.mjs";

const $ = (id) => document.getElementById(id);
const canvas = $("view");
let renderer;
try {
  renderer = createRenderer(canvas);
} catch (error) {
  $("error").textContent = error.message;
}
const aspect = () => canvas.clientWidth / Math.max(1, canvas.clientHeight);
let camera = fitCamera(null);
let parsed = null;
let version = 0;
let state = null;
let frame = 0;
// "" edits family defaults; otherwise the id of the instance being edited.
let scope = "";
let instanceIds = new Set();
// The selected instance's effective values, by parameter id.
let instanceView = null;
// Requirement results of the current model version.
let report = null;
let annotationRoot = null;
let linked = [];
const annotations = createAnnotationController({
  request: id => api(`/api/annotations?id=${encodeURIComponent(id)}`),
  mount: async data => {
    if (!annotationRoot) {
      annotationRoot = $("annotated").attachShadow({ mode: "open" });
      const panel = await (await fetch('/annotation-panel.html')).text();
      annotationRoot.innerHTML = `<link rel="stylesheet" href="/annotations.css"><style>
        :host{display:block;color:#202c3b;background:#f3f5f8;color-scheme:light;font:14px system-ui,sans-serif}
        main{padding:12px;gap:12px;grid-template-columns:minmax(0,1fr) 285px}
        #viewport{height:max(350px,calc(100vh - 265px))}.panel-summary{padding:8px 14px;font-weight:600}
        .linked-edit{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #dce2e9}
        .linked-edit label{display:grid;gap:4px}.linked-edit input,.linked-edit select{width:100%;padding:6px;border:1px solid #cad4e0;border-radius:4px}
        @media(max-width:1050px){main{grid-template-columns:1fr}#viewport{height:420px}}
      </style>${panel}`;
    }
    return window.createOcctAnnotatedViewer(annotationRoot, data, renderLinkedEditor);
  },
  changed: (message, waiting = true) => {
    $("annotation-message").textContent = message;
    $("annotation-message").hidden = !message || $("view-mode").value !== 'annotated';
    $("annotated").inert = Boolean(message && waiting);
  },
});

function refreshAnnotations() {
  const showing = $("view-mode").value === 'annotated';
  $("annotated").hidden = !showing;
  canvas.hidden = showing;
  $("hint").hidden = showing;
  if (!showing) { $("annotation-message").hidden = true; return; }
  return annotations.refresh(scope || instanceIds.values().next().value, version);
}

function renderLinkedEditor(annotation, scene) {
  linked = annotation?.parameters ?? [];
  for (const row of $("parameters").children) row.classList.toggle('linked', linked.includes(row.dataset.parameter));
  const controls = scene.instance === (scope || instanceIds.values().next().value) ? editableControls(annotation, rows()) : [];
  const selection = annotationRoot.getElementById('selection');
  const section = document.createElement('section');
  section.className = 'linked-edit';
  const title = document.createElement('strong');
  title.textContent = controls.length ? `Edit ${scope ? scope : 'family defaults'}` : 'Geometry measurement';
  section.append(title);
  if (!controls.length) {
    const note = document.createElement('p');
    note.textContent = linked.length ? 'These values are derived or require editing in the model file.' : 'This measurement has no linked driving parameter.';
    section.append(note);
  }
  for (const p of controls) {
    const label = document.createElement('label');
    const caption = document.createElement('span');
    caption.textContent = `${p.id}${p.unit ? ` (${p.unit})` : ''}`;
    const input = document.createElement(p.kind === 'choice' ? 'select' : 'input');
    input.setAttribute('aria-label', `Edit ${p.id}`);
    if (p.kind === 'choice') {
      for (const choice of p.choices ?? []) input.append(new Option(choice, choice, false, choice === p.value));
    } else {
      input.type = p.kind === 'boolean' ? 'checkbox' : 'number';
      input.step = p.kind === 'integer' ? '1' : 'any';
      input.value = p.value;
      input.checked = p.value;
      if (p.minimum != null) input.min = p.minimum;
      if (p.maximum != null) input.max = p.maximum;
    }
    const target = scope, displayed = scene.instance;
    input.addEventListener('change', () => {
      if (scope !== target || displayed !== (scope || instanceIds.values().next().value)) return;
      const value = p.kind === 'boolean' ? input.checked : p.kind === 'choice' ? input.value : Number(input.value);
      if (typeof value === 'number' && (!input.value.trim() || !Number.isFinite(value))) return;
      queue({ id: p.id, set: value });
    });
    label.append(caption, input);
    section.append(label);
  }
  const note = document.createElement('p');
  note.textContent = `Views use ${scene.coordinate_system || 'family-local coordinates'}. Changes regenerate immediately; Save writes them to the model file.`;
  section.append(note);
  selection.append(section);
}

function redraw() {
  if (frame || !renderer) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    renderer.draw(camera);
  });
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-OCCT-View": "1" },
  });
  const body = await response.json();
  if (!response.ok) {
    const error = new Error(body.error ?? response.statusText);
    error.details = body;
    throw error;
  }
  return body;
}

function highlight() {
  const index = parsed && scope ? parsed.nodes.findIndex((node) => node.name === scope) : -1;
  renderer?.setSelection(index);
  redraw();
}

async function loadModel(first) {
  const gltf = await (await fetch("/api/model.gltf")).json();
  parsed = parseGltf(gltf);
  renderer?.setModel(parsed);
  if (first) camera = fitCamera(parsed.bounds, aspect());
  $("status").textContent =
    `${parsed.nodes.length} part${parsed.nodes.length === 1 ? "" : "s"} · ` +
    `${parsed.meshes.length} distinct mesh${parsed.meshes.length === 1 ? "" : "es"}`;
  highlight();
}

async function loadInstances() {
  const { instances } = await api("/api/instances");
  instanceIds = new Set(instances.map((instance) => instance.id));
  const select = $("scope");
  const options = [new Option("Family defaults (all instances)", "")];
  for (const instance of instances) {
    const count = instance.overrides.length;
    const label = count ? `${instance.id} (${count} override${count === 1 ? "" : "s"})` : instance.id;
    options.push(new Option(label, instance.id));
  }
  select.replaceChildren(...options);
  if (scope && !instanceIds.has(scope)) scope = "";
  select.value = scope;
}

async function loadInstanceView() {
  instanceView = scope ? await api(`/api/instance?id=${encodeURIComponent(scope)}`) : null;
  renderParameters();
  renderRequirements();
}

async function loadRequirements() {
  report = await api("/api/requirements");
  renderRequirements();
}

const UNITS = { millimeter: "mm", cubicmillimeter: "mm³", kilogram: "kg", radian: "rad", count: "" };
function measured(m) {
  if (!m) return "";
  const unit = UNITS[m.unit] ?? m.unit;
  const limits = [m.minimum != null && `min ${format(m.minimum)}`, m.maximum != null && `max ${format(m.maximum)}`]
    .filter(Boolean)
    .join(", ");
  return `${format(m.value)} ${unit}`.trim() + (limits ? ` (${limits})` : "");
}

/**
 * Pass/fail summary and checks for the current scope: an instance's own
 * results (shared by its variant) and the assembly checks naming it, or
 * every assembly check plus each instance requirement across instances.
 * Failed assembly checks with witness points are marked in the view.
 */
function renderRequirements() {
  const container = $("requirements");
  container.replaceChildren();
  const markers = [];
  if (!report || !Object.keys(report.requirements).length) {
    renderer?.setMarkers(new Float32Array());
    redraw();
    return;
  }
  const checks = [];
  const assembly = report.assembly.filter(
    (r) => !scope || r.witness?.subjects?.some((subject) => subject === scope || subject.startsWith(`${scope}:`)),
  );
  for (const result of assembly) {
    checks.push({ ...result, detail: [result.message || measured(result.measured)] });
    if (!result.passed) markers.push(...(result.witness?.points_mm ?? []));
  }
  if (scope) {
    for (const result of report.variants[report.instances[scope]] ?? []) {
      checks.push({ ...result, detail: [result.message || measured(result.measured)] });
    }
  } else {
    const totals = new Map();
    for (const [instance, variant] of Object.entries(report.instances)) {
      for (const result of report.variants[variant] ?? []) {
        const total = totals.get(result.requirement) ?? { passed: 0, failed: [] };
        if (result.passed) total.passed += 1;
        else total.failed.push(instance);
        totals.set(result.requirement, total);
      }
    }
    for (const [requirement, { passed, failed }] of totals) {
      const shown = failed.slice(0, 4).join(", ") + (failed.length > 4 ? ` and ${failed.length - 4} more` : "");
      checks.push({
        requirement,
        passed: !failed.length,
        detail: [failed.length ? `Fails on ${shown}` : `Passes on all ${passed} instances`],
      });
    }
  }
  checks.sort((a, b) => Number(a.passed) - Number(b.passed));
  const failures = checks.filter((c) => !c.passed).length;
  const summary = document.createElement("div");
  summary.className = "summary";
  summary.innerHTML = failures
    ? `Requirements: <span class="failed">${failures} failing</span> · ${checks.length - failures} passing`
    : `Requirements: <span class="passed">all ${checks.length} passing</span>`;
  container.append(summary);
  const elsewhere = scope ? report.assembly.filter((r) => !r.passed && !assembly.includes(r)).length : 0;
  if (elsewhere) {
    const note = document.createElement("div");
    note.className = "muted";
    note.textContent = `${elsewhere} failing assembly check${elsewhere === 1 ? " does" : "s do"} not name this instance; see Family defaults.`;
    container.append(note);
  }
  for (const check of checks) {
    const info = report.requirements[check.requirement] ?? {};
    const row = document.createElement("div");
    row.className = `check ${check.passed ? "passed" : "failed"}`;
    row.title = info.statement ?? "";
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = check.passed ? "✓" : "✗";
    const name = document.createElement("span");
    name.textContent = check.requirement + (info.priority && info.priority !== "required" ? ` (${info.priority})` : "");
    const detail = document.createElement("span");
    detail.className = "detail";
    detail.textContent = (check.detail ?? []).filter(Boolean).join(" · ");
    row.append(mark, name, detail);
    container.append(row);
  }
  renderer?.setMarkers(modelToGltf(markers));
  redraw();
}

async function setScope(next) {
  if (next === scope) return;
  await flush();
  scope = next;
  linked = [];
  $("scope").value = scope;
  editError = null;
  $("error").textContent = state?.error ?? "";
  highlight();
  await loadInstanceView().catch((error) => ($("error").textContent = error.message));
  await refreshAnnotations();
}

function format(value) {
  return Number.isInteger(value) ? String(value) : String(Number(value.toPrecision(6)));
}

// Changes merge into the last batch while its scope is current; batches are
// sent in order, one request at a time, so none is lost or misdirected.
const batches = [];
let timer = null;
let sending = false;
// A rejected edit's message, kept until an edit succeeds.
let editError = null;

function queue(change) {
  let batch = batches.at(-1);
  if (!batch || batch.scope !== scope) {
    batch = { scope, set: {}, clear: [] };
    batches.push(batch);
  }
  if ("placement" in change) {
    batch.placement = change.placement;
  } else if ("set" in change) {
    batch.set[change.id] = change.set;
    batch.clear = batch.clear.filter((id) => id !== change.id);
  } else {
    delete batch.set[change.id];
    batch.clear.push(change.id);
  }
  clearTimeout(timer);
  timer = setTimeout(flush, "set" in change ? 150 : 0);
}

let flushing = null;
function flush() {
  clearTimeout(timer);
  if (flushing) return flushing;
  if (!batches.length) return Promise.resolve();
  flushing = drainBatches().finally(() => { flushing = null; });
  return flushing;
}
async function drainBatches() {
  const { scope: target, set, clear, placement } = batches.shift();
  sending = true;
  const body = target ? { instance: target, set, clear } : { set };
  if (target && placement) body.placement = placement;
  try {
    const next = await api("/api/parameters", { method: "POST", body: JSON.stringify(body) });
    editError = null;
    annotations.invalidate();
    await apply(next);
  } catch (error) {
    editError = `Edit rejected: ${error.message}`;
    $("error").textContent = editError;
    renderParameters();
    if (error.details?.annotations) {
      await annotations.preview(error.details.annotations);
    } else {
      annotations.invalidate();
      await refreshAnnotations();
    }
  } finally {
    sending = false;
    if (batches.length) await drainBatches();
  }
}

/** Rows for the current scope: metadata from the family, values per scope. */
function rows() {
  if (!state) return [];
  const values = new Map((instanceView?.parameters ?? []).map((p) => [p.id, p]));
  return state.parameters.map((parameter) => {
    const view = scope ? values.get(parameter.id) : null;
    return { ...parameter, value: view ? view.value : parameter.value, source: view?.source ?? null };
  });
}

function renderParameters() {
  const container = $("parameters");
  container.replaceChildren();
  for (const parameter of rows()) {
    const row = document.createElement("div");
    row.className = "parameter" + (linked.includes(parameter.id) ? " linked" : "");
    row.dataset.parameter = parameter.id;
    const label = document.createElement("label");
    const name = document.createElement("span");
    name.textContent = parameter.id;
    const end = document.createElement("span");
    end.className = "label-end";
    if (parameter.source === "own" || parameter.source === "inherited") {
      const tag = document.createElement("span");
      tag.className = `tag ${parameter.source}`;
      tag.textContent = parameter.source === "own" ? "override" : "inherited";
      end.append(tag);
    }
    if (parameter.source === "own") {
      const reset = document.createElement("button");
      reset.className = "reset";
      reset.type = "button";
      reset.textContent = "Reset";
      reset.title = "Remove this override so the instance inherits again";
      reset.addEventListener("click", () => queue({ id: parameter.id }));
      end.append(reset);
    }
    const unit = document.createElement("span");
    unit.className = "muted";
    unit.textContent = typeof parameter.unit === "string" ? parameter.unit : "";
    end.append(unit);
    label.append(name, end);
    row.append(label);
    const change = (value) => queue({ id: parameter.id, set: value });
    if (parameter.kind === "scalar" || parameter.kind === "integer") {
      const number = document.createElement("input");
      number.type = "number";
      number.value = format(parameter.value);
      number.step = parameter.kind === "integer" ? "1" : "any";
      const low = parameter.minimum ?? (parameter.value > 0 ? 0 : parameter.value * 2);
      const high = parameter.maximum ?? Math.max(low + 1, Math.abs(parameter.value) * 3);
      const range = document.createElement("input");
      range.type = "range";
      range.min = low;
      range.max = high;
      // A power-of-ten step gives round values over at least ~100 positions.
      range.step =
        parameter.kind === "integer"
          ? "1"
          : String(10 ** Math.floor(Math.log10((high - low) / 100)));
      range.value = parameter.value;
      const parse = (text) => (parameter.kind === "integer" ? parseInt(text, 10) : parseFloat(text));
      range.addEventListener("input", () => {
        number.value = format(parse(range.value));
        change(parse(range.value));
      });
      number.addEventListener("change", () => {
        const value = parse(number.value);
        if (Number.isFinite(value)) {
          range.value = value;
          change(value);
        }
      });
      row.append(number, range);
    } else if (parameter.kind === "boolean") {
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = parameter.value;
      box.addEventListener("change", () => change(box.checked));
      name.prepend(box);
    } else if (parameter.kind === "choice") {
      const select = document.createElement("select");
      for (const choice of parameter.choices ?? []) {
        select.append(new Option(choice, choice, false, choice === parameter.value));
      }
      select.addEventListener("change", () => change(select.value));
      row.append(select);
    } else {
      const note = document.createElement("div");
      note.className = "muted";
      note.textContent = "Vector parameter: edit in the model file.";
      row.append(note);
    }
    container.append(row);
  }
  if (state && !state.parameters.length) {
    container.innerHTML = '<div class="muted">This family has no parameters.</div>';
  }
  if (scope && instanceView?.placement) {
    container.append(placementEditor(instanceView), instanceActions(instanceView));
  }
}

/** Model-space X extent (mm) of the drawn instance, for spacing a copy. */
function extentX(name) {
  const node = parsed?.nodes.find((n) => n.name === name);
  if (!node) return 0;
  const { min, max } = parsed.meshes[node.mesh].bounds;
  let low = Infinity;
  let high = -Infinity;
  for (const x of [min[0], max[0]]) {
    for (const y of [min[1], max[1]]) {
      for (const z of [min[2], max[2]]) {
        const m = node.matrix;
        const world = m[0] * x + m[4] * y + m[8] * z + m[12];
        low = Math.min(low, world);
        high = Math.max(high, world);
      }
    }
  }
  return (high - low) * 1000;
}

/** Add-copy and delete buttons for the selected instance. */
function instanceActions(view) {
  const row = document.createElement("div");
  row.className = "actions";
  const add = document.createElement("button");
  add.type = "button";
  add.textContent = "Add copy";
  add.title = "Add a clone that inherits from this instance, one part-width along X";
  add.addEventListener("click", async () => {
    await flush();
    const placement = structuredClone(view.placement);
    placement.translation_mm[0] += Math.ceil(extentX(view.id) * 1.25);
    await changeInstances({ add: { source: view.id, placement } });
  });
  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "Delete";
  remove.title = "Remove this instance (Revert undoes it until you save)";
  remove.addEventListener("click", async () => {
    await flush();
    await changeInstances({ delete: view.id });
  });
  row.append(add, remove);
  return row;
}

async function changeInstances(body) {
  try {
    const next = await api("/api/instances", { method: "POST", body: JSON.stringify(body) });
    editError = null;
    await apply(next);
    // Select the new copy, or nothing after a delete.
    scope = next.added ?? "";
    $("scope").value = scope;
    highlight();
    await loadInstanceView();
    await refreshAnnotations();
  } catch (error) {
    editError = `Change rejected: ${error.message}`;
    $("error").textContent = editError;
  }
}

/** Translation, rotation axis, angle and origin fields for one instance. */
function placementEditor(view) {
  const section = document.createElement("div");
  section.className = "placement";
  const title = document.createElement("label");
  title.innerHTML = "<span>Placement</span>";
  const where = document.createElement("span");
  where.className = "muted";
  where.textContent = view.frame ? `mm, in frame ${view.frame}` : "mm";
  title.append(where);
  title.style.display = "flex";
  title.style.justifyContent = "space-between";
  section.append(title);
  const rotation = view.placement.rotation ?? { origin_mm: [0, 0, 0], axis: [0, 0, 1], angle_degrees: 0 };
  const fields = {};
  function triple(name, caption, values) {
    const label = document.createElement("div");
    label.className = "muted";
    label.textContent = caption;
    const row = document.createElement("div");
    row.className = "triple";
    fields[name] = values.map((value, axis) => {
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = format(value);
      input.title = `${caption} ${"XYZ"[axis]}`;
      input.setAttribute("aria-label", input.title);
      input.addEventListener("change", send);
      row.append(input);
      return input;
    });
    section.append(label, row);
  }
  triple("translation", "Translation X, Y, Z", view.placement.translation_mm);
  triple("axis", "Rotation axis X, Y, Z", rotation.axis);
  const angleLabel = document.createElement("div");
  angleLabel.className = "muted";
  angleLabel.textContent = "Angle (degrees; 0 for none)";
  const angle = document.createElement("input");
  angle.type = "number";
  angle.step = "any";
  angle.value = format(rotation.angle_degrees);
  angle.setAttribute("aria-label", "Rotation angle in degrees");
  angle.addEventListener("change", send);
  section.append(angleLabel, angle);
  triple("origin", "Rotation origin X, Y, Z", rotation.origin_mm);
  function send() {
    const read = (inputs) => inputs.map((input) => parseFloat(input.value));
    const values = [...read(fields.translation), ...read(fields.axis), ...read(fields.origin), parseFloat(angle.value)];
    if (!values.every(Number.isFinite)) return;
    const degrees = parseFloat(angle.value);
    queue({
      placement: {
        translation_mm: read(fields.translation),
        rotation: degrees === 0 ? null : { origin_mm: read(fields.origin), axis: read(fields.axis), angle_degrees: degrees },
      },
    });
  }
  return section;
}

let rendered = "";
async function apply(next) {
  const first = version === 0;
  state = next;
  $("family").textContent = next.family;
  $("model").textContent = next.model;
  $("save").disabled = !next.dirty;
  $("revert").disabled = !next.dirty;
  $("save").textContent = next.dirty ? "Save" : "Saved";
  $("error").textContent = next.error ?? editError ?? "";
  if (next.version !== version) {
    version = next.version;
    await Promise.all([
      loadModel(first),
      loadRequirements(),
      loadInstances().then(() => (scope ? loadInstanceView() : null)),
    ]).catch((error) => ($("error").textContent = error.message));
  }
  // Rebuilding inputs mid-drag or with unsent edits would lose them.
  const editing =
    sending ||
    batches.length ||
    document.activeElement?.matches("input[type=range], .placement input");
  const shown = JSON.stringify([rows(), scope && instanceView?.placement]);
  if (shown !== rendered && !editing) {
    rendered = shown;
    renderParameters();
  }
  await refreshAnnotations();
}

async function poll() {
  try {
    await apply(await api("/api/state"));
  } catch (error) {
    $("error").textContent = `Server not reachable: ${error.message}`;
  }
  setTimeout(poll, 1000);
}

$("save").addEventListener("click", async () => {
  await flush();
  try {
    await apply(await api("/api/save", { method: "POST", body: "{}" }));
  } catch (error) {
    $("error").textContent = error.message;
  }
});
$("revert").addEventListener("click", async () => {
  batches.length = 0;
  try {
    editError = null;
    annotations.invalidate();
    await apply(await api("/api/revert", { method: "POST", body: "{}" }));
    if (scope && !instanceIds.has(scope)) await setScope("");
    else await loadInstanceView();
  } catch (error) {
    $("error").textContent = error.message;
  }
});
$("view-mode").addEventListener("change", () => { refreshAnnotations(); redraw(); });
$("fit").addEventListener("click", () => {
  if ($("view-mode").value === "annotated") { annotations.fit(); return; }
  camera = fitCamera(parsed?.bounds ?? null, aspect());
  redraw();
});
$("scope").addEventListener("change", (event) => setScope(event.target.value));

let drag = null;
canvas.addEventListener("contextmenu", (event) => event.preventDefault());
canvas.addEventListener("pointerdown", (event) => {
  drag = { x: event.clientX, y: event.clientY, moved: 0, pan: event.shiftKey || event.button === 2 };
  canvas.setPointerCapture(event.pointerId);
  canvas.style.cursor = "grabbing";
});
canvas.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  drag.x = event.clientX;
  drag.y = event.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.pan) {
    camera = pan(camera, dx, dy, canvas.clientHeight);
  } else {
    const limit = Math.PI / 2 - 0.01;
    camera = {
      ...camera,
      yaw: camera.yaw - dx * 0.008,
      pitch: Math.max(-limit, Math.min(limit, camera.pitch + dy * 0.008)),
    };
  }
  redraw();
});
canvas.addEventListener("pointerup", (event) => {
  const click = drag && drag.moved < 4 && event.button === 0;
  drag = null;
  canvas.style.cursor = "grab";
  // Until the instance list arrives a click could not be resolved; ignore it.
  if (!click || !parsed || !instanceIds.size) return;
  const box = canvas.getBoundingClientRect();
  const x = ((event.clientX - box.left) / box.width) * 2 - 1;
  const y = 1 - ((event.clientY - box.top) / box.height) * 2;
  const index = pick(parsed, ray(camera, aspect(), x, y));
  const name = index >= 0 ? parsed.nodes[index].name : "";
  setScope(instanceIds.has(name) ? name : "");
});
canvas.addEventListener("pointercancel", () => {
  drag = null;
  canvas.style.cursor = "grab";
});
canvas.addEventListener(
  "wheel",
  (event) => {
    event.preventDefault();
    camera = { ...camera, distance: camera.distance * Math.exp(event.deltaY * 0.001) };
    redraw();
  },
  { passive: false },
);
new ResizeObserver(redraw).observe(canvas);
poll();
</script>
</body>
</html>
