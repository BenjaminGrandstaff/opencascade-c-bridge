[package]
name = "occt-parametric"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unit-aware parametric feature graphs over opencascade-c-bridge"

[dependencies]
occt-bridge = { path = "../occt-bridge" }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Scale benchmark suite for the roadmap's scaling requirement; run with
# tools/bench/run.sh. It has no harness so it can enforce its own budgets.
[[bench]]
name = "scale"
harness = false

[[bench]]
name = "document_diff"
path = "benches/scale/document_diff.rs"
harness = false

[[bench]]
name = "document_merge"
path = "benches/scale/document_merge.rs"
harness = false

[[bench]]
name = "document_management"
path = "benches/scale/document_management.rs"
harness = false

[[bench]]
name = "linkage"
harness = false

[[bench]]
name = "rotating_motion"
harness = false

[[bench]]
name = "balance"
harness = false

[[bench]]
name = "templates"
harness = false

[[bench]]
name = "large_linkage"
harness = false

[[bench]]
name = "branch_search"
harness = false

[[bench]]
name = "sketch_advanced"
harness = false

[[bench]]
name = "extrusion_extents"
harness = false

[[bench]]
name = "curved_extrusion_extents"
harness = false

[[bench]]
name = "drill_points"
harness = false
